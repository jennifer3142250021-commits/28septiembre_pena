
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mis Diagramas</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .contenedor {
            background-color: white;
            width: 100%;
            max-width: 600px;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .descripcion {
            color: #666;
            font-size: 17px;
            margin-bottom: 30px;
        }

        .botones {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background-color: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #4f63c7;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        footer {
            margin-top: 30px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Mis Diagramas</h1>

        <p class="descripcion">
            Selecciona el diagrama que deseas consultar
        </p>

        <div class="botones">

            <button onclick="window.location.href='diagramaflow_dinero.html'">
                Diagrama de Dinero
            </button>

            <button onclick="window.location.href='diagramaflow_clientes.html'">
                Diagrama de Clientes
            </button>

            <button onclick="window.location.href='diagramaflow_idea.html'">
                Diagrama de Idea
            </button>

            <button onclick="window.location.href='caso_1.html'">
                Caso 1
            </button>

        </div>

        <footer>
            Proyecto de diagramas HTML
        </footer>

    </div>

</body>
</html>
